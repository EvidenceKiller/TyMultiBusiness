plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.parcelize'
}
apply from: "../module.build.gradle"

android {
    namespace 'com.ty.tybusbase'
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            android.libraryVariants.all { variant ->
                variant.outputs.all {
                    def date = new Date().format('yyyy-MM-dd')
                    outputFileName = "ZDZ-BusBase-${android.defaultConfig.versionName}-${date}.aar"
                }
            }
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'com.google.android.material:material:1.6.1'
    implementation project(':TyIdentityAuth')
    api project(':nfcReader')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    api 'adl.ssp:ssp-common-report:2.1.0-20260616.064257-34'

    //rx管理View的生命周期
    api(rootProject.ext.dependencies["rxlifecycle-components"]) {
        exclude group: 'com.android.support'
    }
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.9'
    api rootProject.ext.dependencies["lifecycle_viewmodel_ktx"]
    api rootProject.ext.dependencies["BaseRecyclerViewAdapterHelper"]
    api rootProject.ext.dependencies["glide"]
    api rootProject.ext.dependencies["mmkv"]

    api rootProject.ext.dependencies["camera-core"]
    api rootProject.ext.dependencies["camera-camera2"]
    api rootProject.ext.dependencies["camera-lifecycle"]
    api rootProject.ext.dependencies["camera-view"]
    api rootProject.ext.dependencies["gson"]

    api(name: 'AdlPose-2025-04-29', ext: 'aar')
    api(name: 'AdlPoseSdk-2026-05-12', ext: 'aar')
    api(name: 'AdlPoseGt-2026-05-27', ext: 'aar')
    api(name: 'NzPoseCore-v1.0.0-2026-05-27', ext: 'aar')
    api(name: 'AdlCamera-2026-07-29', ext: 'aar')
    api(name: 'NzWebSerivce-2026-08-07', ext: 'aar')
    api(name: 'AdlBase-2026-08-24', ext: 'aar')
    api(name: 'NzAuthCore-v2.0.1-2026-04-28', ext: 'aar')
    api(name: 'ZySportCore-2025-04-08', ext: 'aar')
    api(name: 'NzSportGeneral-v1.1.0-2026-07-06', ext: 'aar')
    api(name: 'NzBluetooth-2026-01-22', ext: 'aar')
    api(name: 'AdlRopeSkipLite-2026-06-15', ext: 'aar')
    api(name: 'AiPowerSpecial-v2.0.0-2026-10-15', ext: 'aar')
    api(name: 'TyInference-ClassicAlgoJ-2026-09-11', ext: 'aar')

    annotationProcessor rootProject.ext.dependencies["glide-compiler"]

    api 'com.amazonaws:aws-android-sdk-s3:2.77.0'
    api 'com.amazonaws:aws-android-sdk-core:2.77.0'
    api 'org.opencv:opencv:4.11.0'

    api ("com.ssp:ssp-common-oss-android:1.1.2@aar")

    // 其他依赖(必须)
    api 'com.jakewharton.timber:timber:4.7.1'
//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.5'
}