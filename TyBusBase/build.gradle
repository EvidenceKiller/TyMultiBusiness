plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
apply from: "../module.build.gradle"

android {
    namespace 'com.ty.tybusbase'
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            android.libraryVariants.all { variant ->
                variant.outputs.all {
                    def date = new Date().format('yyyy-MM-dd')
                    outputFileName = "ZDZ-BusBase-${date}.aar"
                }
            }
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'com.google.android.material:material:1.6.1'
    implementation project(':TyIdentityAuth')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    api 'adl.ssp:ssp-common-report:2.1.0-20250722.085837-98:jar-with-dependencies'
    api 'com.tencent.tbs:tbssdk:44286'

    //rx管理View的生命周期
    api(rootProject.ext.dependencies["rxlifecycle-components"]) {
        exclude group: 'com.android.support'
    }
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.9'
    api rootProject.ext.dependencies["lifecycle_viewmodel_ktx"]
    api rootProject.ext.dependencies["BaseRecyclerViewAdapterHelper"]
    api rootProject.ext.dependencies["glide"]
    api rootProject.ext.dependencies["mmkv"]

    api rootProject.ext.dependencies["camera-core"]
    api rootProject.ext.dependencies["camera-camera2"]
    api rootProject.ext.dependencies["camera-lifecycle"]
    api rootProject.ext.dependencies["camera-view"]

    api(name: 'AdlPose-2025-04-29', ext: 'aar')
    api(name: 'AdlPoseSdk-2025-09-30', ext: 'aar')
    api(name: 'AdlPoseGt-2025-05-28', ext: 'aar')
    api(name: 'AdlPoseCore-2025-05-28', ext: 'aar')
    api(name: 'AdlCamera-2025-07-24', ext: 'aar')
    api(name: 'AdlBase-2025-07-24', ext: 'aar')
    api(name: 'AdlWebSerivce-2025-07-17', ext: 'aar')
    api(name: 'AdlAuthCore-v2-2025-09-30', ext: 'aar')
    api(name: 'ZySportCore-2025-04-08', ext: 'aar')
    api(name: 'AdlSportGeneral-2025-07-22', ext: 'aar')

    annotationProcessor rootProject.ext.dependencies["glide-compiler"]
}