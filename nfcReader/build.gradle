plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

apply from: "../module.build.gradle"

android {
    namespace 'com.ty.nfc.reader'

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            android.libraryVariants.all { variant ->
                variant.outputs.all {
                    def date = new Date().format('yyyy-MM-dd')
                    outputFileName = "ZDZ-NfcReader-${android.defaultConfig.versionName}-${date}.aar"
                }
            }
        }
    }
}

def versionName = android.defaultConfig.versionName
def date = new Date().format('yyyy-MM-dd')

tasks.register("sourcesJar", Jar) {
    archiveClassifier.set("sources")
    destinationDirectory.set(layout.buildDirectory.dir("outputs/sources"))
    archiveFileName.set("ZDZ-NfcReader-${versionName}-${date}-sources.jar")
    from(android.sourceSets.main.java.srcDirs)
    from(android.sourceSets.main.kotlin.srcDirs)
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'com.google.android.material:material:1.6.1'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}