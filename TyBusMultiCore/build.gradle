plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

apply from: "../module.build.gradle"

android {
    namespace 'com.ty.bus.multi'
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            android.libraryVariants.all { variant ->
                variant.outputs.all {
                    def date = new Date().format('yyyy-MM-dd')
                    outputFileName = "ZDZ-BusMulti-${date}.aar"
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'com.google.android.material:material:1.6.1'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    api project(':TyBusBase')
    api(name: 'TySport-ForwardFlexion-2025-12-05', ext: 'aar')
    api(name: 'TySport-Basic-Common-2025-12-01', ext: 'aar')
    api(name: 'TySport-Special-Project-Common-2025-12-03', ext: 'aar')

    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0")
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}